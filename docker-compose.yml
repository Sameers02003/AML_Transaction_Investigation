services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: aml, POSTGRES_PASSWORD: aml, POSTGRES_DB: aml }
    ports: [ "5432:5432" ]
    volumes: [ pgdata:/var/lib/postgresql/data ]
  redis:
    image: redis:7
    ports: [ "6379:6379" ]
  redpanda:
    image: redpandadata/redpanda:latest
    command: >
      redpanda start --smp 1 --memory 512M --overprovisioned --node-id 0 --kafka-addr PLAINTEXT://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports: [ "9092:9092", "9644:9644" ]
  prometheus:
    image: prom/prometheus
    volumes: [ "./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml" ]
    ports: [ "9090:9090" ]
    extra_hosts: [ "host.docker.internal:host-gateway" ]
  grafana:
    image: grafana/grafana
    ports: [ "3000:3000" ]
    volumes: [ grafana-data:/var/lib/grafana ]
volumes:
  pgdata:
  grafana-data:
